<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo-section">
        <div class="logo-icon">🎓</div>
        <h1 class="logo-title">EduManager</h1>
      </div>
      <h2 class="auth-title">Connexion</h2>
      <p class="auth-subtitle">Accédez à votre espace de gestion</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Message d'information -->
      <div *ngIf="info" class="info-message error-message">
        {{ info }}
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="mail" class="form-label">
          <i class="fa fa-envelope" aria-hidden="true"></i>
          Adresse email
        </label>
        <input
          type="email"
          id="mail"
          formControlName="mail"
          class="form-input"
          [class.error]="mail?.invalid && mail?.touched"
          placeholder="votre@email.com"
          autocomplete="email"
        >
        <div *ngIf="mail?.invalid && mail?.touched" class="field-error">
          <span *ngIf="mail?.errors?.['required']">L'adresse email est requise</span>
          <span *ngIf="mail?.errors?.['email']">Veuillez entrer une adresse email valide</span>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fa fa-lock" aria-hidden="true"></i>
          Mot de passe
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          [class.error]="password?.invalid && password?.touched"
          placeholder="••••••••"
          autocomplete="current-password"
        >
        <div *ngIf="password?.invalid && password?.touched" class="field-error">
          <span *ngIf="password?.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="password?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</span>
        </div>
      </div>

      <!-- Google Sign-In -->
      <div class="google-signin-section">
        <div class="divider">
          <span class="divider-text">ou</span>
        </div>
        <div class="google-button-container">
          <div id="google-signin-button" class="google-signin-button"></div>
          <button
            *ngIf="!isGoogleInitialized"
            type="button"
            class="google-fallback-btn"
            (click)="onGoogleFallbackLogin()">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuer avec Google
          </button>
        </div>
      </div>

      <!-- Bouton de connexion -->
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="loginForm.invalid || loading"
        [loading]="loading"
        loadingText="Connexion en cours..."
        icon="pi pi-sign-in"
        iconPosition="left">
        Se connecter
      </app-button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      <p class="auth-link-text">
        Vous n'avez pas encore de compte ?
        <a routerLink="/auth/register" class="auth-link">Créer un compte</a>
      </p>
    </div>
  <!-- End auth-card -->
</div>
