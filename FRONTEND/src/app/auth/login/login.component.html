<div class="auth-container">
  <app-card 
    variant="elevated"
    padding="lg"
    class="max-w-md mx-auto">
    
    <!-- Header -->
    <div class="auth-header">
      <div class="logo-section">
        <div class="logo-icon">🎓</div>
        <h1 class="logo-title">EduManager</h1>
      </div>
      <h2 class="auth-title">Connexion</h2>
      <p class="auth-subtitle">Accédez à votre espace de gestion</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Message d'information -->
      <app-alert 
        *ngIf="info" 
        variant="info"
        [closable]="true"
        (closed)="info = ''">
        {{ info }}
      </app-alert>

      <!-- Message d'erreur -->
      <app-alert 
        *ngIf="error" 
        variant="error"
        [closable]="true"
        (closed)="error = ''">
        {{ error }}
      </app-alert>

      <!-- Email -->
      <div class="form-group">
        <label for="mail" class="form-label">
          <i class="fa fa-envelope" aria-hidden="true"></i>
          Adresse email
        </label>
        <input
          type="email"
          id="mail"
          formControlName="mail"
          class="form-input"
          [class.error]="mail?.invalid && mail?.touched"
          placeholder="votre@email.com"
          autocomplete="email"
        >
        <div *ngIf="mail?.invalid && mail?.touched" class="field-error">
          <span *ngIf="mail?.errors?.['required']">L'adresse email est requise</span>
          <span *ngIf="mail?.errors?.['email']">Veuillez entrer une adresse email valide</span>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fa fa-lock" aria-hidden="true"></i>
          Mot de passe
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          [class.error]="password?.invalid && password?.touched"
          placeholder="••••••••"
          autocomplete="current-password"
        >
        <div *ngIf="password?.invalid && password?.touched" class="field-error">
          <span *ngIf="password?.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="password?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</span>
        </div>
      </div>

      <!-- Bouton de connexion -->
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="loginForm.invalid"
        [loading]="loading"
        loadingText="Connexion en cours..."
        icon="pi pi-sign-in"
        iconPosition="left"
        (clicked)="onSubmit()">
        Se connecter
      </app-button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      <p class="auth-link-text">
        Vous n'avez pas encore de compte ?
        <a routerLink="/auth/register" class="auth-link">Créer un compte</a>
      </p>
    </div>
  </app-card>
</div>
