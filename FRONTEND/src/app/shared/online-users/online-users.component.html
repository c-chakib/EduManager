<div class="online-users-container">
  <div class="online-users-header">
    <h3>
      <i class="pi pi-circle-fill online-indicator"></i>
      Utilisateurs en ligne ({{ onlineUsers.length }})
    </h3>
  </div>

  <div class="online-users-list">
    <div
      class="online-user-item"
      *ngFor="let user of onlineUsers"
      (click)="selectUser(user)"
      [class.clickable]="showChatButton">
      <div class="user-avatar">
        <div class="avatar-circle">
          {{ getUserInitials(user) }}
        </div>
        <div class="online-status"></div>
      </div>

      <div class="user-info">
        <div class="user-name">{{ getUserDisplayName(user) }}
          <span class="current-user-badge" *ngIf="user.userId === currentUserId">(Vous)</span>
        </div>
        <div class="user-role" *ngIf="user.role">{{ user.role }}</div>
      </div>

      <div class="user-actions">
        <button class="chat-button" (click)="selectUser(user)" title="Rejoindre le chat général">
          <i class="pi pi-comments"></i>
        </button>
      </div>
    </div>

    <div class="no-users" *ngIf="onlineUsers.length === 0">
      <i class="pi pi-users"></i>
      <p>Aucun utilisateur en ligne</p>
    </div>
  </div>
</div>
