<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <nav class="breadcrumb">
        <a routerLink="/" class="breadcrumb-link">
          <i class="fas fa-home"></i> Accueil
        </a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Guide d'utilisation</span>
      </nav>
      <h1 class="page-title">
        <i class="fas fa-book-open"></i>
        Guide d'utilisation
      </h1>
      <p class="page-description">
        Suivez notre guide étape par étape pour maîtriser toutes les fonctionnalités d'EduManager
      </p>
    </div>
  </div>

  <div class="page-content">
    <div class="content-grid">
      <div class="section-card" *ngFor="let step of steps; let i = index">
        <div class="step-number">Étape {{i + 1}}</div>
        <div class="card-icon">
          <i [class]="step.icon"></i>
        </div>
        <h3 class="card-title">{{step.title}}</h3>
        <p class="card-content">{{step.content}}</p>
      </div>
    </div>

    <div class="quick-links-section">
      <h2 class="section-title">Besoin d'aide supplémentaire ?</h2>
      <div class="links-grid">
        <a routerLink="/documentation" class="quick-link">
          <i class="fas fa-book"></i>
          <span>Documentation complète</span>
        </a>
        <a routerLink="/faq" class="quick-link">
          <i class="fas fa-question-circle"></i>
          <span>Questions fréquentes</span>
        </a>
        <a routerLink="/support" class="quick-link">
          <i class="fas fa-life-ring"></i>
          <span>Contacter le support</span>
        </a>
      </div>
    </div>
  </div>
</div>
