<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Book Base -->
  <g transform="translate(30, 35)">
    <!-- Book Cover -->
    <rect x="0" y="0" width="60" height="50" rx="4" fill="url(#bookGradient)"/>
    
    <!-- Book Pages -->
    <rect x="5" y="5" width="50" height="40" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Bookmark -->
    <rect x="45" y="0" width="8" height="30" fill="#be185d" opacity="0.8"/>
    <path d="M 49 30 L 45 26 L 53 26 Z" fill="#be185d" opacity="0.8"/>
    
    <!-- Lines on pages -->
    <line x1="12" y1="15" x2="48" y2="15" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
    <line x1="12" y1="22" x2="48" y2="22" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
    <line x1="12" y1="29" x2="38" y2="29" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
    <line x1="12" y1="36" x2="45" y2="36" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Graduation Cap -->
  <g transform="translate(35, 25)">
    <!-- Cap Base -->
    <polygon points="25,15 10,22 25,29 40,22" fill="url(#logoGradient)"/>
    
    <!-- Cap Top -->
    <rect x="22" y="10" width="6" height="8" fill="url(#logoGradient)" opacity="0.8"/>
    
    <!-- Tassel -->
    <circle cx="28" cy="10" r="3" fill="#be185d"/>
    <line x1="28" y1="10" x2="32" y2="6" stroke="#be185d" stroke-width="2"/>
    <circle cx="32" cy="6" r="2" fill="#be185d" opacity="0.6"/>
  </g>
  
  <!-- Letter "E" -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#logoGradient)" text-anchor="middle">E</text>
</svg>
